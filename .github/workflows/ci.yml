name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint (ruff, scope in ruff.toml)
        run: ruff check .
      - name: Layout test (required files, no public grade)
        run: python -m unittest tests.test_layout -v
      - name: Learn unit tests
        run: python -m unittest tests.test_learn_agent -v
      - name: Learn runner
        run: python level-1-learn/run_learn.py
      - name: Build unit tests
        run: python -m unittest tests.test_build_agent -v
      - name: Build runner
        run: python level-2-build/run_build.py
      - name: Deep unit tests
        run: python -m unittest tests.test_deep_agent -v
      - name: Deep runner
        run: python level-3-deep/run_deep.py
      - name: Deep extra analyses (ablation, intervals, cross-task)
        run: |
          python -m unittest tests.test_deep_extras -v
          python level-3-deep/analyze_deep.py --no-timing
      - name: All tests (discovery)
        run: python -m unittest discover -s tests -v
      - name: Results regenerate unchanged from the task suites
        run: git diff --exit-code -- level-1-learn level-2-build level-3-deep
